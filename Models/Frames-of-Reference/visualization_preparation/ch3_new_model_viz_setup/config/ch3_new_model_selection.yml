# Chapter 3 (new model) – default selection for main-text figures

# Dates to include. Omit or set to [] to include all dates present.
include_dates:
  - "2024-11-04"
  - "2024-12-17"

# Keep higher training sizes for appendix later
max_training_size: 1000

# Optional: restrict to specific condition values (uncomment to use)
# include_canonical_data_levels: [17, 50, 83, 89]
# include_intrinsic_data_levels: [50, 67, 89]
# include_odds_reduction: [1, 2, 4, 8, 16, inf]

ci:
  method: bootstrap   # bootstrap | sem
  level: 0.95
  n_boot: 2000
  seed: 0
